<!DOCTYPE html>
<html lang="ru">
  <head>

    <!-- Основной контент -->
    <main class="main">

      <!-- Секция 2: Карточки лотов (Lots) -->
      <section class="lots">
        <!-- Сюда пойдет список ul с тегами li -> a -> article -->
      </section>

      <!-- Секция 3: Описание аукциона (About) -->
      <section class="about">
        <!-- Сюда пойдут два контейнера для колонок текста -->
      </section>

    <!-- Подвал сайта -->
    <footer class="footer">
      <!-- Сюда пойдут адрес, меню и ссылки на соцсети (vk, yt, pinterest) -->
    </footer>
